<!doctype html>
<!-- Store promo tiles. Render: open this file with ?size=small (440x280) or ?size=big (1400x560) and screenshot the .stage element
     into tile-small-440x280.png / tile-marquee-1400x560.png. Keep claims inside product-facts.yaml. -->
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#080b11; --border:rgba(16,185,129,.25); --accent:#10b981; --accent-2:#34d399; --cyan:#22d3ee; --text:#f3f4f6; --text-2:#9ca3af; --text-3:#6b7280; --mono:"Liberation Mono",ui-monospace,monospace; --sans:"Liberation Sans",system-ui,sans-serif; }
body { font-family:var(--sans); overflow:hidden; }
.stage { position:relative; display:flex; align-items:center; }
/* small tile 440x280 */
.small { width:440px; height:280px; background:radial-gradient(300px 160px at 90% 0%, rgba(16,185,129,.2), transparent 60%), linear-gradient(150deg,#0c1424,#070a10); padding:28px; flex-direction:column; align-items:flex-start; justify-content:center; gap:12px; }
.small .row { display:flex; align-items:center; gap:10px; }
.small img { width:44px; height:44px; border-radius:11px; }
.small .name { font-family:var(--mono); font-weight:800; font-size:21px; color:var(--text); }
.small h1 { font-family:var(--mono); font-size:17px; font-weight:800; line-height:1.3; color:var(--text-2); }
.small h1 em { font-style:normal; color:var(--accent-2); }
.small .tags { display:flex; gap:6px; margin-top:4px; }
.tag { font-family:var(--mono); font-size:9px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid var(--border); color:var(--accent-2); background:rgba(16,185,129,.08); }
/* marquee 1400x560 */
.big { width:1400px; height:560px; background:radial-gradient(700px 380px at 85% 10%, rgba(16,185,129,.18), transparent 55%), radial-gradient(500px 300px at 5% 100%, rgba(34,211,238,.1), transparent 60%), linear-gradient(150deg,#0b1322,#060910); padding:70px 90px; align-items:center; gap:70px; }
.big .left { flex:1; }
.big .brand { display:flex; align-items:center; gap:14px; margin-bottom:26px; }
.big .brand img { width:52px; height:52px; border-radius:13px; }
.big .brand .n { font-family:var(--mono); font-weight:800; font-size:26px; color:var(--text); }
.big h1 { font-family:var(--mono); font-weight:800; font-size:44px; line-height:1.15; color:var(--text); letter-spacing:-1px; }
.big h1 em { font-style:normal; color:var(--accent); }
.big p { margin-top:20px; font-size:17px; line-height:1.55; color:#9ca3af; max-width:520px; }
.big .tags { display:flex; gap:10px; margin-top:26px; }
.big .tag { font-size:12px; padding:6px 14px; }
.flow { display:flex; flex-direction:column; gap:14px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:18px; padding:28px 34px; }
.flow .f { display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:16px; font-weight:700; color:var(--text); }
.flow .num { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:13px; background:rgba(16,185,129,.12); color:var(--accent-2); border:1px solid var(--border); }
.flow .arr { color:var(--accent); font-size:14px; margin-left:8px; }
</style>
</head>
<body>
<div class="stage" id="s"></div>
<script>
const size = new URLSearchParams(location.search).get('size') || 'small';
const el = document.getElementById('s');
if (size === 'small') {
  el.className = 'stage small';
  el.innerHTML = `
    <div class="row"><img src="../icons/icon128.png"><span class="name">Session Transfer</span></div>
    <h1>Move logged-in sessions<br>between browsers. <em>No re-login.</em></h1>
    <div class="tags"><span class="tag">Optional encryption</span><span class="tag">No servers</span><span class="tag">Manifest V3</span></div>`;
} else {
  el.className = 'stage big';
  el.innerHTML = `
    <div class="left">
      <div class="brand"><img src="../icons/icon128.png"><span class="n">Session Transfer</span></div>
      <h1>Session transfer for Chrome.<br><em>Local. No servers.</em></h1>
      <p>Move authenticated sessions — cookies, localStorage, sessionStorage, IndexedDB &amp; Cache Storage — between profiles or devices.</p>
      <div class="tags"><span class="tag">Optional AES-256-GCM</span><span class="tag">No accounts</span><span class="tag">No telemetry</span><span class="tag">Manifest V3</span></div>
    </div>
    <div class="flow">
      <div class="f"><span class="num">1</span> Export session <span class="arr">&rarr;</span></div>
      <div class="f"><span class="num">2</span> Copy or download <span class="arr">&rarr;</span></div>
      <div class="f"><span class="num">3</span> Import &amp; restore <span class="arr">&rarr;</span></div>
      <div class="f"><span class="num">4</span> Checked &amp; logged in</div>
    </div>`;
}
</script>
</body>
</html>
