name: signal-deploy

# Manual only: the repo avoids costly automatic CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler 4.146 needs Node 22+
      - run: npm test
      - run: npx --yes wrangler@4.146.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional: wrangler infers the account when the token can reach only one account.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
