schema: appforge/permissions@1
permissions:
  - permission: cookies
    required: true
    reason: "Read and restore HttpOnly/Secure cookies for the user-selected origin — the only API that can reach HttpOnly cookies"
    data_access: [cookies_selected_origin]
    security_impact: high
  - permission: scripting
    required: true
    reason: "Inject a one-time collector/restorer function into the active tab to read/write localStorage, sessionStorage, IndexedDB and Cache Storage"
    data_access: [page_storage_selected_origin]
    security_impact: high
  - permission: storage
    required: true
    reason: "Persist the on-device setting (chrome.storage.local); hold an in-memory-only draft of the receive flow (chrome.storage.session)"
    data_access: [local_setting]
    security_impact: medium
  - permission: "http://*/*"
    required: true
    reason: "The tool must operate on cookies/storage for whatever website the user picks; no fixed host list is possible"
    data_access: [any_site_cookies_and_storage_user_selected]
    security_impact: high
  - permission: "https://*/*"
    required: true
    reason: "Same as http://*/* — covers HTTPS origins the user selects"
    data_access: [any_site_cookies_and_storage_user_selected]
    security_impact: high
