# product-facts.yaml: Session Transfer (Chrome extension)
# Every fact below was checked against extension/ code, not only against listing copy.
# Cite as [fact:<key>] in facts-used.md. If a fact is not here, it is not a checked claim.
# Code references are symbol names (line numbers drift); doc references (README.md:N etc.) are valid at the pinned sha only: re-check them when the sha moves.
product: session-transfer
pinned_sha: 98f473e4f9cd9d8f1afe7b34c31cda7f06fc0958   # origin/main when written (extension v1.2.1 in package.json)
checked: 2026-10-01
checked_by: CPO (APP-307)
seeded_from: APP-288 facts-used (pinned 3e86543; rows 1-9 re-checked at 98f473e)
claims_status:
  # use as: safe = say it; narrow = say it only with the wording given; do_not_claim = never say it
  safe: verified in code and consistent with PRIVACY.md
  narrow: true but easy to overstate; use the given wording
  do_not_claim: false, unverified, or not supported by the policy

facts:
  purpose:
    claim: "Moves an authenticated website session (cookies, localStorage, sessionStorage, IndexedDB, Cache Storage) between Chrome profiles, browsers or devices."
    status: safe
    sources: ["README.md:3-5", "CHROMEWEBSTORE.md:26,30"]
    code: ["extension/src/core/types.ts (NON_TRANSFERABLE: what is NOT moved)", "extension/manifest.config.ts (permissions: cookies, scripting, tabs, storage; http/https hosts)"]
    note: "Moves the web session only. It is a user-saved file; the user carries it to the other browser."

  encryption:
    claim: "Packages are NOT encrypted by default. With the 'Encrypt with a transfer code' setting ON: AES-256-GCM (random 12-byte IV), key derived from the code with PBKDF2-SHA256, 600,000 iterations, random 16-byte salt."
    status: safe
    sources: ["README.md:9-13", "PRIVACY.md:21-29", "CHROMEWEBSTORE.md (HOW IT WORKS 2, SECURITY bullet 2)"]
    code: ["extension/src/core/crypto.ts (encryptPayload: none vs code branch; PBKDF2_ITERATIONS = 600_000)", "extension/src/core/crypto.ts (Web Crypto only, no custom crypto)"]
    note: "Default mode has no encryption and no tamper detection: whoever holds the text has the session. Never say 'encrypted' or 'AES' about the default mode. v1.2.x 'embedded' packages are still readable by the receiver."

  key_mode_default:
    claim: "Default (setting OFF): the package is plain (not encrypted), so one step moves the session. The Ready screen warns that anyone with the text can restore the session until the shown time. Setting 'Encrypt with a transfer code (more secure)' ON gives the two-channel flow: encrypted package + a separate code."
    status: narrow
    sources: ["CHANGELOG.md [Unreleased]", "extension/docs/threat-model.md #1, #2, #8"]
    code: ["extension/src/popup/App.tsx (SETTING_KEY 'settings.requireTransferCode', loadRequireCode, require-code-checkbox, collect sends requireCode)", "extension/src/background/service-worker.ts (handleCollect: requireCode ? 'code' : 'none')", "extension/src/popup/ready.tsx (embedded-warning vs two-step screen)"]
    note: "Setting is per browser profile (chrome.storage.local), absent = OFF. In the default mode a leaked copy of the text IS the session: do not say 'a leaked package is useless without the code' for it. Both browsers need the new version: an older receiver cannot read a default-mode (plain) package."

  transfer_code:
    claim: "Optional (default OFF). When ON, each export makes a new random code (12 characters from a 31-letter/digit set, shown as ABCD-EFGH-JKMN) and the package cannot be decrypted without it. When OFF there is no code."
    status: narrow
    sources: ["README.md:9-13", "CHROMEWEBSTORE.md (HOW IT WORKS 3)"]
    code: ["extension/src/core/crypto.ts (generateTransferCode; code mode in encryptPayload/decryptPayload)", "extension/src/background/service-worker.ts (handleInspect: codeRequired reply)"]
    note: "'One-time' would mean a fresh code per export, not single-use: nothing marks a package or code as used, so the same package + code can be imported again until it expires. Do not say 'one-time code' in listing copy, 'works only once' or 'self-destructs'."

  package_expiry:
    claim: "The extension refuses to import a package more than 5 minutes after export ('This transfer has expired.'), and refuses a package whose stated lifetime is over 5 min 30 s. Both are checked before anything is decrypted."
    status: narrow
    sources: ["CHROMEWEBSTORE.md (SECURITY bullet 3)", "PRIVACY.md:21-29", "extension/docs/threat-model.md #8"]
    code: ["extension/src/background/service-worker.ts (TRANSFER_TTL_MS = 5 * 60 * 1000; passed to encryptPayload)", "extension/src/core/crypto.ts (checkPackage: expiry then lifetime; MAX_PACKAGE_LIFETIME_MS)", "extension/src/popup/ready.tsx + App.tsx (UI shows 'Expires in ...' / 'expires in ...')"]
    verdict: "CONFIRMED in code."
    note: "The expiry is an extension-side check in BOTH modes. In the default mode the key is inside the package, so after expiry anyone with the text can still decrypt it with a short script and the cookies work until the site ends the session. In code mode, someone with package + code can do the same. Say 'the extension refuses packages older than 5 minutes'; do NOT say 'cryptographically expires', 'self-destructs' or 'cannot be used after 5 minutes'."

  origin_binding:
    claim: "A package restores only into the website origin it was exported from. The origin (with expiry and key mode) is bound as AES-GCM authenticated data, and it is re-checked after decrypt."
    status: safe
    sources: ["README.md:15", "CHROMEWEBSTORE.md:37,61"]
    code: ["extension/src/core/crypto.ts (headerAad: origin in AAD; decryptPayload: payload origin must equal package origin)", "extension/src/background/service-worker.ts (handleRestore: originMismatch confirmation; resolveDestinationTab(origin))"]

  local_only:
    claim: "No server, no account, no analytics, no tracking. The extension makes no network requests."
    status: safe
    sources: ["README.md:13-14", "PRIVACY.md:30-33", "CHROMEWEBSTORE.md:34,76"]
    code: ["extension/package.json (dependencies: react, react-dom only)", "grep over extension/src at the pinned sha: no fetch( / XMLHttpRequest / WebSocket / sendBeacon / analytics SDK"]
    note: "Fully local describes the extension. The user saves the package as a file (.stpkg) and moves it; what happens to that file afterwards is outside the extension. Use the policy wording, not 'never leaves your device'."

  no_data_collected_by_developer:
    claim: "No session data is collected, received or logged by the developer."
    status: safe
    sources: ["PRIVACY.md:6-8"]
    code: ["same grep as local_only"]

  conflict_choice:
    claim: "If the destination already has a session, the user chooses Replace, Merge or Cancel (Cancel is the default); nothing is overwritten silently."
    status: safe
    sources: ["CHROMEWEBSTORE.md:38"]
    code: ["extension/src/core/types.ts (ConflictStrategy)", "extension/src/popup/App.tsx (useState strategy default 'cancel'; Conflict options text)", "extension/src/background/service-worker.ts (handleRestore: strategy; cancel leaves destination unchanged)"]

  not_transferable:
    claim: "Passkeys/WebAuthn, hardware-backed credentials, OS credential stores and TLS-bound session state cannot be transferred; the extension says so in the popup."
    status: safe
    sources: ["README.md:16", "CHROMEWEBSTORE.md:39"]
    code: ["extension/src/core/types.ts (NON_TRANSFERABLE list)", "extension/src/background/service-worker.ts (handleCollect: sent to the popup with the export)", "extension/src/popup/App.tsx (InspectReady and Restored callouts: 'Not restored (by design): WebAuthn / passkeys, hardware credentials, TLS state.')"]
    note: "Nothing says a site will accept the restored session. Sites can bind a session to a device or IP. Do not promise 'you will be logged in'; say 'moves your session'."

  verification_report:
    claim: "After a restore the popup shows a verification report and reloads the page."
    status: safe
    sources: ["CHROMEWEBSTORE.md:31", "README.md:7"]
    code: ["extension/src/popup/App.tsx (Restored: verification report, Passed or Partial, and whether the page reloaded)"]
    note: "A report of what was written, not a guarantee that the site accepts it."

  size_limit:
    claim: "A session over 100 MB is refused at export; over 20 MB shows a large-size warning."
    status: safe
    sources: []
    code: ["extension/src/background/service-worker.ts (MAX_PACKAGE_BYTES, LARGE_WARN_BYTES; handleCollect error message)", "extension/src/popup/ready.tsx (Ready: 'Download file is more reliable than Copy' hint above 20 MB)"]
    note: "Not in any listing text. Listed because users will hit it."

  permissions:
    claim: "Permissions: cookies, scripting, storage, plus http/https host access (the host access is what lets the extension read the active tab's address; there is no separate `tabs` permission since 1.4.0). Injection is on demand from the popup; no content script runs on page load."
    status: safe
    sources: ["PRIVACY.md:34-43", "CHROMEWEBSTORE.md:55-61"]
    code: ["extension/manifest.config.ts (permissions; no content_scripts key; grep confirms)"]

  playwright_export:
    claim: "\"Export for Playwright\" (under More options) saves the active site's cookies and localStorage as a Playwright storageState .json file. sessionStorage and IndexedDB are not in it, and partitioned cookies are left out (the popup says how many)."
    status: narrow
    sources: ["extension/README.md (Export for Playwright)", "extension/store-listing.md (FOR DEVELOPERS AND QA)"]
    code: ["extension/src/core/storage-state.ts (buildStorageState, toPlaywrightCookie)", "extension/src/background/service-worker.ts (handleExportState)", "extension/e2e/export-and-domains.spec.ts (A: a fresh Playwright context loads the file and sees the login)"]
    note: "The file is plain text and holds live logins: the popup says so after saving. Say 'Playwright storageState'; do not claim Puppeteer, Selenium or Cypress support (not tested). Do not say 'secure export'."

  extra_cookie_domains:
    claim: "Under More options the user can type up to 5 plain host names (for example accounts.example.com); their cookies are added to the package. Nothing is added unless the user types it."
    status: safe
    sources: ["extension/README.md (Cookies from other sites)"]
    code: ["extension/src/core/storage-state.ts (parseExtraDomains)", "extension/src/background/cookie-manager.ts (collectCookies)", "extension/e2e/export-and-domains.spec.ts (B, C, D)"]
    note: "The package is still bound to the site the user was on; the extra cookies are restored with their own domains. Do not say it 'fixes SSO' or 'works with every sign-in': it moves cookies only."

  partitioned_cookies:
    claim: "Partitioned (CHIPS) cookies of the site are transferred together with their partition."
    status: safe
    sources: ["CHANGELOG.md [1.4.0]"]
    code: ["extension/src/background/cookie-manager.ts (getAllCookies, restoreCookies)", "extension/e2e/export-and-domains.spec.ts (E)"]
    note: "Needs a Chrome that supports the cookies partitionKey option (119 or later); older Chrome falls back to unpartitioned cookies only."

  audience:
    claim: "Developers moving sessions between dev/staging/prod profiles; people switching computers or browsers; QA teams reproducing authenticated states."
    status: safe
    sources: ["CHROMEWEBSTORE.md:41-44"]
    code: []
    note: "Positioning copy, not a capability. Allowed because the capabilities above back it."

do_not_claim:
  - claim: "Free / no cost"
    why: "No source states price. Add only if the CWS listing shows free and there are no purchases."
  - claim: "Available on the Chrome Web Store"
    why: "No checked source in the repo gives the live status. CHROMEWEBSTORE.md:15 still says 'Pending review' (stale: commit b8c615e records it live on the dashboard on 2026-10-01). Read the live listing before saying it."
  - claim: "Works only once / self-destructing code / single-use package"
    why: "Not enforced; see transfer_code."
  - claim: "A leaked package is useless without the code / two-channel security (as a general statement)"
    why: "True only with 'Require a separate transfer code' ON. By default the key is inside the package; see key_mode_default."
  - claim: "The package self-destructs / cannot be used after 5 minutes / expires cryptographically"
    why: "The 5-minute limit is a check in the extension. In the default mode the key is inside the package, so a holder can still decrypt it later; see package_expiry."
  - claim: "One-time transfer code / the code is always required"
    why: "The code is optional and off by default; see transfer_code."
  - claim: "Never leaves your device / zero-knowledge / unhackable / military-grade"
    why: "The user exports a file and carries it; the policy only says the extension contacts no servers."
  - claim: "Works on every site / keeps you logged in everywhere"
    why: "Passkeys, hardware, TLS-bound state and device-bound sessions are not moved."
  - claim: "Counts: users, installs, ratings, speed, 'in seconds'"
    why: "No source."
  - claim: "Works in Firefox, Safari or Edge"
    why: "Chrome extension, Manifest V3. Other browsers are not tested in this repo."
  - claim: "Packages are always encrypted / AES-256 by default"
    why: "Default packages are plain; encryption is the opt-in 'Encrypt with a transfer code' setting."
  - claim: "The extension backs up the destination session"
    why: "Backups were removed in 1.3.0."

