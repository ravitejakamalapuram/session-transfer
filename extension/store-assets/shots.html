<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg:#080b11; --surface:#0f1523; --surface-2:#111827; --border:rgba(16,185,129,.18);
  --border-strong:rgba(16,185,129,.5); --text:#f3f4f6; --text-2:#9ca3af; --text-3:#6b7280;
  --accent:#10b981; --accent-2:#34d399; --cyan:#22d3ee; --amber:#fbbf24; --code-bg:#05070b;
  --mono:ui-monospace,"SF Mono","Liberation Mono",Menlo,Consolas,monospace;
  --sans:"Liberation Sans",system-ui,-apple-system,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1280px; height:800px; background:var(--bg); font-family:var(--sans); overflow:hidden; }
.stage {
  width:1280px; height:800px; position:relative;
  background:
    radial-gradient(900px 420px at 78% -5%, rgba(16,185,129,.13), transparent 60%),
    radial-gradient(700px 380px at -5% 108%, rgba(34,211,238,.09), transparent 55%),
    linear-gradient(rgba(16,185,129,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,185,129,.045) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,44px 44px,44px 44px,auto;
}
.brandline { position:absolute; top:46px; left:64px; display:flex; align-items:center; gap:12px; }
.brandline img { width:34px; height:34px; border-radius:9px; }
.brandline .n { font-family:var(--mono); font-weight:800; font-size:19px; color:var(--text); }
.badge { display:inline-flex; align-items:center; gap:7px; padding:4px 12px; border-radius:999px;
  font-family:var(--mono); font-size:11px; font-weight:600; background:rgba(16,185,129,.08);
  color:var(--accent-2); border:1px solid var(--border-strong); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); display:inline-block; }
.dot.gray { background:var(--text-3); box-shadow:none; }

.caption { position:absolute; left:64px; top:120px; max-width:430px; }
.caption .eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--accent); font-weight:700; }
.caption h1 { font-family:var(--mono); font-weight:800; font-size:40px; line-height:1.12; color:var(--text); margin-top:14px; letter-spacing:-0.5px; }
.caption h1 em { font-style:normal; color:var(--accent); }
.caption p { margin-top:16px; font-size:15px; line-height:1.6; color:var(--text-2); }
.caption .steps { margin-top:22px; display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--text-3); }
.caption .steps b { color:var(--accent-2); }
.caption .steps .arrow { color:var(--accent); }

/* mock browser window */
.win { position:absolute; right:64px; top:96px; width:640px; height:620px; border-radius:16px;
  background:var(--surface); border:1px solid var(--border); box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 60px rgba(16,185,129,.07); overflow:hidden; }
.winbar { display:flex; align-items:center; gap:12px; padding:11px 14px; background:rgba(8,11,17,.85); border-bottom:1px solid var(--border); }
.winbar .d { width:10px; height:10px; border-radius:50%; }
.urlbar { flex:1; display:flex; align-items:center; gap:8px; background:var(--code-bg); border:1px solid var(--border);
  border-radius:999px; padding:6px 14px; font-family:var(--mono); font-size:12px; color:var(--text-2); }
.exticon { width:22px; height:22px; border-radius:6px; border:2px solid var(--accent); padding:1px; }
.page { height:100%; background:linear-gradient(160deg,#0c1220,#0a0e18); padding:28px; position:relative; }
.page .p-eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--text-3); }
.page .p-title { font-family:var(--mono); font-size:22px; font-weight:800; color:var(--text); margin-top:6px; }
.page .p-card { margin-top:18px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05); border-radius:12px; padding:14px; }
.page .p-row { display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px; padding:7px 2px; color:var(--text-2); border-bottom:1px solid rgba(255,255,255,.04); }
.page .p-row:last-child { border-bottom:none; }
.page .pill { font-size:10px; padding:2px 9px; border-radius:999px; background:rgba(16,185,129,.12); color:var(--accent-2); border:1px solid var(--border-strong); }

/* the extension popup (faithful replica of the real popup CSS) */
.popup { position:absolute; top:6px; right:10px; width:330px; border-radius:14px; overflow:hidden;
  background:radial-gradient(500px 240px at 100% -10%, rgba(16,185,129,.10), transparent 60%), var(--bg);
  border:1px solid var(--border-strong); box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 40px rgba(16,185,129,.12); }
.p-head { display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--border); background:rgba(8,11,17,.7); }
.p-head img { width:22px; height:22px; border-radius:6px; }
.p-head .t { font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--text); }
.p-head .s { font-size:8.5px; color:var(--text-3); font-family:var(--mono); }
.p-body { padding:13px; display:flex; flex-direction:column; gap:11px; }
.ocard { border:1px solid var(--border); background:var(--surface); border-radius:11px; padding:12px; }
.ocard .h { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--text); }
.ocard .u { font-size:9.5px; color:var(--text-3); margin-top:2px; font-family:var(--mono); }
.obadge { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:9.5px;
  font-family:var(--mono); font-weight:600; margin-top:9px; background:rgba(16,185,129,.10); color:var(--accent-2); border:1px solid var(--border-strong); }
.rows { display:flex; flex-direction:column; gap:3px; }
.row { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-radius:7px;
  background:var(--surface); border:1px solid rgba(255,255,255,.03); font-family:var(--mono); font-size:10.5px; color:var(--text); }
.row .nm { display:flex; align-items:center; gap:8px; }
.row .vl { color:var(--text-2); font-size:9.5px; }
.ok { color:var(--accent); font-weight:800; }
.warn { color:var(--amber); font-weight:800; }
.gray { color:var(--text-3); }
.btn { border:none; border-radius:9px; padding:11px 13px; font-family:var(--mono); font-size:11.5px; font-weight:700;
  cursor:default; display:flex; align-items:center; justify-content:center; gap:7px; }
.btn.primary { background:var(--accent); color:#04120c; box-shadow:0 6px 20px rgba(16,185,129,.25); }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
.codebox { background:var(--code-bg); border:1px solid var(--border-strong); border-radius:11px; padding:14px; text-align:center;
  box-shadow:0 0 22px rgba(16,185,129,.12) inset; }
.codebox .lb { font-family:var(--mono); font-size:8.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.1em; margin-bottom:7px; }
.codebox .cd { font-family:var(--mono); font-size:22px; font-weight:800; letter-spacing:.13em; color:var(--accent-2); }
.callout { border-radius:9px; padding:9px 11px; font-size:9.5px; line-height:1.5; font-family:var(--mono); }
.callout.info { background:rgba(34,211,238,.07); border:1px solid rgba(34,211,238,.25); color:#a5f3fc; }
.callout.ok { background:rgba(16,185,129,.08); border:1px solid var(--border-strong); color:#a7f3d0; }
.callout.warn { background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.3); color:#fde68a; }
.title2 { font-family:var(--mono); font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; }
.bigcheck { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:rgba(16,185,129,.12);
  border:1px solid var(--border-strong); color:var(--accent-2); font-size:22px; font-weight:800; margin:0 auto; }
.input { width:100%; background:var(--code-bg); border:1px solid var(--border); border-radius:9px; padding:9px 11px;
  color:var(--text); font-family:var(--mono); font-size:11px; }
.input.code { text-align:center; letter-spacing:.13em; font-size:15px; font-weight:700; color:var(--accent-2); }
.filebox { width:100%; background:transparent; border:1px solid var(--border); border-radius:9px; padding:11px 13px;
  font-family:var(--mono); font-size:11px; font-weight:700; color:var(--text); display:flex; align-items:center; justify-content:center; gap:7px; }
.center { text-align:center; }
</style>
</head>
<body>
<div class="stage">
  <div class="brandline">
    <img src="../icons/icon128.png" alt="">
    <span class="n">Session Transfer</span>
    <span class="badge"><span class="dot"></span> Manifest V3 · AES-256-GCM</span>
  </div>
  <div class="caption" id="caption"></div>

  <div class="win">
    <div class="winbar">
      <span class="d" style="background:#ff5f57"></span><span class="d" style="background:#febc2e"></span><span class="d" style="background:#28c840"></span>
      <div class="urlbar"><span style="color:var(--accent)">&#128274;</span> app.example.com/dashboard</div>
      <img class="exticon" src="../icons/icon48.png" alt="">
    </div>
    <div class="page">
      <div class="p-eyebrow">DASHBOARD</div>
      <div class="p-title">Welcome back, Ana</div>
      <div class="p-card">
        <div class="p-row"><span>Account</span><span class="pill">Pro · Active</span></div>
        <div class="p-row"><span>Projects</span><span>12</span></div>
        <div class="p-row"><span>Last sync</span><span>2 min ago</span></div>
        <div class="p-row"><span>Session</span><span style="color:var(--accent-2)">Authenticated</span></div>
      </div>
      <div class="p-card">
        <div class="p-row"><span>api.example.com</span><span style="color:var(--text-3)">200 OK</span></div>
        <div class="p-row"><span>auth.example.com</span><span style="color:var(--text-3)">200 OK</span></div>
      </div>
      <div class="popup" id="popup"></div>
    </div>
  </div>
</div>

<script>
const ICON = '../icons/icon48.png';
const rows = (items) => `<div class="rows">${items.map(([n,v,s]) =>
  `<div class="row"><span class="nm"><span class="${s==='ok'?'ok':s==='warn'?'warn':'gray'}">${s==='ok'?'\u2713':s==='warn'?'\u26A0':'\u25CB'}</span>${n}</span><span class="vl">${v}</span></div>`).join('')}</div>`;

const heads = `<div class="p-head"><img src="${ICON}"><div><div class="t">Session Transfer</div><div class="s">AES-256-GCM \u00B7 local only</div></div></div>`;

const states = {
  home: {
    cap: { e:'STEP 1 \u00B7 SOURCE BROWSER', h:'Session <em>detected</em>.<br>One click to export.', p:'Cookies, localStorage, sessionStorage, IndexedDB and Cache Storage are captured for this origin only \u2014 never mixed across domains.' },
    pop: heads + `<div class="p-body">
      <div class="ocard"><div class="h">app.example.com</div><div class="u">https://app.example.com</div>
        <span class="obadge"><span class="dot"></span> Session detected</span></div>
      ${rows([['Cookies','12','ok'],['Local Storage','18','ok'],['Session Storage','4','ok'],['IndexedDB','2 DBs','ok'],['Cache Storage','124','ok']])}
      <button class="btn primary">&#128274; Transfer Session</button>
      <button class="btn ghost">Receive Session</button>
    </div>` },
  transfer: {
    cap: { e:'STEP 2 \u00B7 ENCRYPT', h:'Encrypted.<br>Ready to <em>transfer</em>.', p:'A one-time code unlocks an AES-256-GCM package with an ephemeral key. It expires in 5 minutes \u2014 and never touches a server.' },
    pop: heads + `<div class="p-body">
      <div class="center"><div class="bigcheck">\u2713</div><div class="title2">Ready to transfer</div></div>
      <div class="codebox"><div class="lb">One-time transfer code \u00B7 expires in 5m</div><div class="cd">ABX7-K9P2-WXYZ</div></div>
      <div class="callout info">Load this package on the other browser and enter the code.</div>
      <button class="btn primary">\u2B07 Download encrypted package</button>
      ${rows([['Cookies','12','ok'],['IndexedDB','2 DBs','ok'],['Cache Storage','124','ok']])}
    </div>` },
  receive: {
    cap: { e:'STEP 3 \u00B7 DESTINATION', h:'Paste the code.<br>We do the <em>rest</em>.', p:'The package is decrypted in-browser, validated, and restored strictly into its own origin \u2014 with an explicit warning if anything looks off.' },
    pop: heads + `<div class="p-body">
      <div class="title2">Receive session</div>
      <div class="filebox">&#128196; session-app.example.com.stpkg</div>
      <div class="title2" style="margin-top:2px">Transfer code</div>
      <input class="input code" value="ABX7-K9P2-WXYZ" readonly>
      ${rows([['Cookies','12','ok'],['Local Storage','18','ok'],['IndexedDB','2 DBs','ok']])}
      <button class="btn primary">Import Session</button>
    </div>` },
  restored: {
    cap: { e:'DONE \u00B7 VERIFIED', h:'Logged in.<br><em>Verified.</em>', p:'After restoring, the extension re-reads every storage area and compares counts \u2014 then reloads the page so you land already authenticated.' },
    pop: heads + `<div class="p-body">
      <div class="center"><div class="bigcheck">\u2713</div><div class="title2">Session restored</div></div>
      ${rows([['Cookies','12 / 12','ok'],['Local Storage','18 / 18','ok'],['Session Storage','4 / 4','ok'],['IndexedDB','2 / 2','ok'],['Cache Storage','124 / 124','ok']])}
      <div class="callout ok">Verification: Passed \u00B7 page reloaded \u00B7 destination backed up</div>
      <button class="btn primary">Open Website</button>
    </div>` },
};

const s = new URLSearchParams(location.search).get('state') || 'home';
const st = states[s] || states.home;
document.getElementById('popup').innerHTML = st.pop;
document.getElementById('caption').innerHTML = `
  <div class="eyebrow">${st.cap.e}</div>
  <h1>${st.cap.h}</h1>
  <p>${st.cap.p}</p>
  <div class="steps"><b>Export</b><span class="arrow">\u2192</span><b>Encrypt</b><span class="arrow">\u2192</span><b>Import</b><span class="arrow">\u2192</span><b>Verify</b></div>`;
</script>
</body>
</html>
